{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow border-0 rounded-4">
            <div class="card-body p-5">
                <h3 class="text-center mb-4">Generate Image Caption</h3>
                
                <div id="drop-zone" class="border border-2 border-primary border-dashed rounded-3 p-5 text-center mb-4" style="cursor:pointer; background-color: #f8f9fa;">
                    <i class="bi bi-cloud-arrow-up display-1 text-primary"></i>
                    <h5 class="mt-3">Drag & Drop Image Here</h5>
                    <p class="text-muted">or click to browse (JPG, PNG, WEBP)</p>
                    <input type="file" id="file-input" accept="image/*" style="display:none;">
                </div>

                <div id="loading" class="text-center d-none my-5">
                    <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-3 fs-5">Analyzing image features...</p>
                </div>

                <div id="result" class="d-none">
                    <div class="row">
                        <div class="col-md-6">
                            <img id="preview-img" src="" class="img-fluid rounded shadow-sm" alt="Preview">
                        </div>
                        <div class="col-md-6">
                            <div class="card h-100 border-success border-2">
                                <div class="card-body text-center d-flex flex-column justify-content-center">
                                    <h5 class="card-title text-success mb-3"><i class="bi bi-check-circle-fill me-2"></i>Generated Caption</h5>
                                    <p id="caption-text" class="fs-4 fw-bold mb-4"></p>
                                    <p class="text-muted small">Confidence: <span id="confidence-text"></span> | Time: <span id="time-text"></span>s</p>
                                    <div class="d-grid gap-2">
                                        <button class="btn btn-outline-primary" onclick="speakText()"><i class="bi bi-volume-up-fill me-2"></i>Listen</button>
                                        <button class="btn btn-outline-secondary" onclick="resetUI()">Upload Another</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const loading = document.getElementById('loading');
    const result = document.getElementById('result');

    dropZone.addEventListener('click', () => fileInput.click());

    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('bg-light');
    });

    dropZone.addEventListener('dragleave', (e) => {
        e.preventDefault();
        dropZone.classList.remove('bg-light');
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('bg-light');
        if (e.dataTransfer.files.length) {
            handleUpload(e.dataTransfer.files[0]);
        }
    });

    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length) {
            handleUpload(e.target.files[0]);
        }
    });

    function handleUpload(file) {
        // Show preview
        const reader = new FileReader();
        reader.onload = (e) => {
            document.getElementById('preview-img').src = e.target.result;
        };
        reader.readAsDataURL(file);

        // UI updates
        dropZone.classList.add('d-none');
        loading.classList.remove('d-none');

        // Prepare request
        const formData = new FormData();
        formData.append('image', file);

        // Allow up to 3 minutes (first upload loads InceptionV3 ~88MB)
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 180000);

        fetch('/upload', {
            method: 'POST',
            body: formData,
            signal: controller.signal
        })
        .then(response => response.json())
        .then(data => {
            clearTimeout(timeoutId);
            loading.classList.add('d-none');
            if (data.error) {
                // Show the real error from the server
                const errDiv = document.createElement('div');
                errDiv.className = 'alert alert-danger mt-3';
                errDiv.innerHTML = `<strong>Error:</strong> ${data.error}`;
                document.querySelector('.card-body').appendChild(errDiv);
                dropZone.classList.remove('d-none');
                return;
            }
            result.classList.remove('d-none');
            
            document.getElementById('caption-text').innerText = data.caption;
            document.getElementById('confidence-text').innerText = (data.confidence * 100).toFixed(1) + '%';
            document.getElementById('time-text').innerText = data.time.toFixed(2);
        })
        .catch(error => {
            loading.classList.add('d-none');
            dropZone.classList.remove('d-none');
            console.error('Fetch error:', error);
            const errDiv = document.createElement('div');
            errDiv.className = 'alert alert-danger mt-3';
            errDiv.innerText = 'Network error. Check your connection and try again.';
            document.querySelector('.card-body').appendChild(errDiv);
        });
    }

    function resetUI() {
        result.classList.add('d-none');
        loading.classList.add('d-none');
        dropZone.classList.remove('d-none');
        fileInput.value = '';
    }

    function speakText() {
        const text = document.getElementById('caption-text').innerText;
        const msg = new SpeechSynthesisUtterance();
        msg.text = text;
        window.speechSynthesis.speak(msg);
    }
</script>
{% endblock %}
