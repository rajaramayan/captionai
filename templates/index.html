{% extends 'base.html' %}
{% block content %}
<div class="px-4 py-5 my-5 text-center">
    <h1 class="display-5 fw-bold text-primary">Intelligent Image Captioning</h1>
    <div class="col-lg-6 mx-auto">
      <p class="lead mb-4">Upload any image and let our advanced CNN-LSTM deep learning model automatically generate a meaningful, human-like description. Fast, accurate, and accessible.</p>
      <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
        <a href="{{ url_for('main.upload') }}" class="btn btn-primary btn-lg px-4 gap-3">Get Started</a>
        <a href="{{ url_for('auth.register') }}" class="btn btn-outline-secondary btn-lg px-4">Create Account</a>
      </div>
    </div>
</div>
{% endblock %}
